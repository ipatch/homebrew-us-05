name: brew pr-pull

on:
  pull_request_target:
    types:
      - labeled

env:
  HOMEBREW_DEVELOPER: 1

jobs:
  pr-pull:
    if: contains(github.event.pull_request.labels.*.name, 'pr-pull')
    runs-on: ubuntu-latest
    # permissions:
    #   contents: write
    #   pull-requests: write
    permissions: write-all

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Set up git
        uses: Homebrew/actions/git-user-config@master


      # since i'm uploading bottles using github packages the below env vars are reqd
      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.actor }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"

      - name: debug with lhotari/action-upterm
        id: debug-workflow-run
        # uses: actions/checkout@v2
        # NOTE: ipatch, seems to be issue with macos runners circa oct 2024
        # uses: lhotari/action-upterm@v1
        #-------
        uses: owenthereal/action-upterm@v1
        if: ${{ failure() }}
        with:
          # limit ssh access to user who triggered the workflow
          limit-access-to-actor: true
          # shut down server after 10 minutes if no one connects
          wait-timeout-minutes: 10

      - name: Push commits
        uses: Homebrew/actions/git-try-push@master
        with:
          token: ${{ github.token }}
          # branch: main
          # the default branch for homebrew-us-05 is `dev`
          branch: dev

      - name: Delete branch
        if: github.event.pull_request.head.repo.fork == false
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push --delete origin "$BRANCH"
