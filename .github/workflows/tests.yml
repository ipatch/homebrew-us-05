---

name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # - run: brew test-bot --only-tap-syntax

      - name: build bottle using test-bot for current formula
        id: build-bottle
        run: |
          brew test-bot \
          --only-formulae \
          --only-json-tab \
          --skip-recursive-dependents \
          --fail-fast \
          --root-url=https://ghcr.io/v2/ipatch/homebrew-us-05

        if: github.event_name == 'pull_request'

      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Debug PR context
        if: github.event_name == 'pull_request'
        run: |
          echo "PR Number: ${{ github.event.pull_request.number }}"
          echo "PR Title: ${{ github.event.pull_request.title }}"
          echo "Head commit message: ${{ github.event.pull_request.head.commit.message }}"
          echo "Head commit SHA: ${{ github.event.pull_request.head.sha }}"
    
      # TODO: figure out a way to conditionally call this step
      - name: debug actions
        if: contains(github.event.head_commit.message, '[debug]')
        run: "false"

      - name: debug with lhotari/action-upterm
        id: debug-workflow-run
        # uses: actions/checkout@v2
        # NOTE: ipatch, seems to be issue with macos runners circa oct 2024
        # uses: lhotari/action-upterm@v1
        #-------
        uses: owenthereal/action-upterm@v1
        if: ${{ failure() }}
        with:
          # limit ssh access to user who triggered the workflow
          limit-access-to-actor: true
          # shut down server after 10 minutes if no one connects
          wait-timeout-minutes: 10

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
