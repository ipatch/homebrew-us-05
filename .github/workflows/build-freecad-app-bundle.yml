---

name: build FreeCAD MacOS app bundle

on:
  workflow_dispatch:

env:
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_DEVELOPER: 1

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - macos-14
          - macos-13
          - macos-12

    runs-on: ${{ matrix.os }}

    timeout-minutes: 1200

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Determine Homebrew Path
        id: determine-homebrew-path
        run: echo "##[set-output name=brew-path;]$(/usr/bin/uname -m grep -q 'arm64' && echo '/opt/homebrew' || echo '/usr/local')"

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Cache Homebrew
        id: cache-homebrew
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.determine-homebrew-path.outputs.brew-path }}
            ${{ steps.determine-homebrew-path.outputs.brew-path }}/Library/Homebrew/vendor/bundle/ruby
            ${{ steps.determine-homebrew-path.outputs.brew-path }}/Library/Taps
            ${{ steps.determine-homebrew-path.outputs.brew-path }}/Cellar
            ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('**/Brewfile') }}
          restore-keys: homebrew-${{ runner.os }}-

      - name: setup freecad tap
        id: setup-freecad-tap
        run: |
          brew tap -v freecad/freecad

      - name: install freecad deps
        id: install-freecad-deps
        run: brew install --only-dependencies -v freecad/freecad/freecad

      # - name: checkout repository
      #   uses: actions/checkout@v2

      - name: debug with lhotari/action-upterm
        id: debug-workflow-run
        # uses: actions/checkout@v2
        uses: lhotari/action-upterm@v1
        if: ${{ failure() }}
        with:
          # limit ssh access to user who triggered the workflow
          limit-access-to-actor: true
          # shut down server after 10 minutes if no one connects
          wait-timeout-minutes: 10

